name: Gerar APK do PROFiT

on:
  push:
    tags: ["v*"]          # criar uma tag v1.0, v1.1... publica uma nova versão
  workflow_dispatch:      # ou rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Ligar ao Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Falta o secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Falta o secret SUPABASE_ANON_KEY"; exit 1; }
          printf 'window.PROFIT_CONFIG = { url: "%s", anonKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > app/src/main/assets/config.js

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta o secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/profit.jks

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PROFiT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PROFiT-apk
          path: PROFiT.apk

      - name: Publicar para download
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: PROFiT.apk
          body: |
            📲 **Baixe o PROFiT.apk** abaixo e abra no celular Android.
            Se pedir, permita "instalar apps desconhecidos".
            Para entrar, crie uma conta com seu e-mail e aceite os termos de uso.

  site:
    # Publica o site (página + PROFiT.apk) no GitHub Pages a cada nova versão
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PROFiT-apk
          path: site

      - name: Montar o site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/"
          cp app/src/main/assets/termos.html site/privacidade.html   # mesmo texto do app
          printf 'User-agent: *\nAllow: /\nSitemap: %ssitemap.xml\n' "$url" > site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>%s</loc><lastmod>%s</lastmod></url></urlset>\n' "$url" "$(date -u +%F)" > site/sitemap.xml
          ls -la site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
